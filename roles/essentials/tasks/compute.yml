---
- name: "DESK_ESSENTIALS_CONFIGURE - Build GTK copy tasks per user"
  ansible.builtin.set_fact:
    essentials_gtk_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_essentials | default(false) -%}
      {%-   for f in essentials_dotfiles_gtk -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

