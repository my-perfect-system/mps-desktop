---
- name: "DESK_ESSENTIALS_CONFIGURE - Build GTK copy tasks per user"
  ansible.builtin.set_fact:
    essentials_gtk_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in essentials_users_present -%}
      {%-   for f in essentials_dotfiles_gtk -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "DESK_ESSENTIALS_CONFIGURE - Build gedit copy tasks per user"
  ansible.builtin.set_fact:
    essentials_gedit_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in essentials_users_present -%}
      {%-   for f in essentials_dotfiles_gedit -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "DESK_ESSENTIALS_CONFIGURE - Build dconf copy tasks per user"
  ansible.builtin.set_fact:
    essentials_dconf_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in essentials_users_present -%}
      {%-   for f in essentials_dotfiles_dconf -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "DESK_ESSENTIALS_CONFIGURE - Copy GTK config files"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src }}"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0600"
  loop: "{{ essentials_gtk_copy_items }}"
  when: item.src == '.gtkrc-2.0'
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"

- name: "DESK_ESSENTIALS_CONFIGURE - Copy GTK config directories"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src }}"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0700"
  loop: "{{ essentials_gtk_copy_items }}"
  when: item.src != '.gtkrc-2.0'
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"

- name: "DESK_ESSENTIALS_CONFIGURE - Copy gedit config"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src | dirname }}/"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0600"
  loop: "{{ essentials_gedit_copy_items }}"
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"

- name: "DESK_ESSENTIALS_CONFIGURE - Copy dconf config"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src | dirname }}/"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0600"
  loop: "{{ essentials_dconf_copy_items }}"
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"
