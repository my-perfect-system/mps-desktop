---
- name: Ensure lightdm wallpapers directory exists
  ansible.builtin.file:
    path: "{{ lightdm_wallpapers_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Set lightdm greeter background
  ansible.builtin.lineinfile:
    path: "{{ lightdm_greeter_conf }}"
    regexp: "^background="
    line: "background={{ lightdm_wallpapers_dir }}/{{ lightdm_wallpaper }}"
    state: present
    create: false
  become: true
