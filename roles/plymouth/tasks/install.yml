---
- name: Install plymouth packages
  ansible.builtin.package:
    name: "{{ plymouth_packages }}"
    state: present
  become: true

- name: Copy plymouth theme files
  ansible.builtin.copy:
    src: "{{ plymouth_themes_dir }}/text/"
    dest: "{{ plymouth_themes_dir }}/{{ plymouth_default_theme }}/"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy plymouth .plymouth file
  ansible.builtin.copy:
    src: "{{ plymouth_themes_dir }}/text/text.plymouth"
    dest: "{{ plymouth_themes_dir }}/{{ plymouth_default_theme }}/{{ plymouth_default_theme }}.plymouth"
    owner: root
    group: root
    mode: "0644"
  become: true

