- name: Replace 'text' in .plymouth with default theme name
  ansible.builtin.replace:
    path: "{{ plymouth_themes_dir }}/{{ plymouth_default_theme }}/{{ plymouth_default_theme }}.plymouth"
    regexp: "text"
    replace: "{{ plymouth_default_theme }}"
  become: true

- name: Copy bootsplash background image
  ansible.builtin.copy:
    src: "/boot/grub/themes/{{ plymouth_default_theme }}/background.png"
    dest: "{{ plymouth_themes_dir }}/{{ plymouth_default_theme }}/"
    owner: root
    group: root
    mode: "0644"
  become: true

