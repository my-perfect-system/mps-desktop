---
- name: "DESK_ROFI_CONFIGURE - Copy rofi dotfiles"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src }}"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0700"
  loop: "{{ rofi_copy_items }}"
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"
  become: true

- name: "DESK_ROFI_CONFIGURE - Ensure ~/.local/bin exists for each user"
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.desktop_rofi | default(false)
    - entity.state == 'present'

- name: "DESK_ROFI_CONFIGURE - Copy rofi boot scripts to ~/.local/bin"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/scripts/{{ item.src }}"
    dest: "{{ item.entity.home }}/.local/bin/{{ item.src }}"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0700"
  loop: "{{ rofi_script_items }}"
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"
  become: true
