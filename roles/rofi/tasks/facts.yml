---
- name: "DESK_ROFI_CONFIGURE - Build per-user dotfile copy items"
  ansible.builtin.set_fact:
    rofi_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_rofi | default(false) -%}
      {%-   for f in rofi_dotfiles -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "DESK_ROFI_CONFIGURE - Build per-user script copy items"
  ansible.builtin.set_fact:
    rofi_script_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_rofi | default(false) -%}
      {%-   for s in rofi_scripts -%}
      {%-     set _ = items.append({'entity': entity, 'src': s}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}
