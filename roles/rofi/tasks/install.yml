---
- name: Install rofi and dependencies
  ansible.builtin.apt:
    name: "{{ rofi_packages }}"
    state: present
  become: true

- name: Ensure rofi themes directory exists
  ansible.builtin.file:
    path: "{{ rofi_themes_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy rofi themes
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/rofi/themes/{{ item }}"
    dest: "{{ rofi_themes_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ rofi_themes }}"
  become: true
