---
- name: "DESK_ROFI_INSTALL - Install rofi packages"
  ansible.builtin.apt:
    name: "{{ rofi_packages }}"
    state: present
  become: true

- name: "DESK_ROFI_INSTALL - Ensure themes dir exists"
  ansible.builtin.file:
    path: "{{ rofi_themes_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "DESK_ROFI_INSTALL - Deploy rofi themes to /usr/share/rofi/themes"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/rofi/themes/{{ item }}"
    dest: "{{ rofi_themes_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ rofi_themes }}"
  become: true
