---
argument_specs:
  main:
    short_description: Install Spotify client via HTTPS APT repo
    options:
      spotify_key_url:
        type: str
        required: false
        default: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
        description: "URL to download the Spotify public key"
      spotify_repo_url:
        type: str
        required: false
        default: https://repository.spotify.com
        description: "Base URL for the Spotify APT repository"
      spotify_keyring_path:
        type: str
        required: false
        default: /etc/apt/trusted.gpg.d/spotify.gpg
        description: "Destination path for the dearmored Spotify GPG key"
      spotify_apt_filename:
        type: str
        required: false
        default: spotify
        description: "Filename for the Spotify APT source list"
      spotify_packages:
        type: list
        required: false
        default:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
        description: "APT packages required to install Spotify (prereqs)"
