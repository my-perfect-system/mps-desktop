---
- name: Install spotify package prereqs
  ansible.builtin.package:
    name: "{{ spotify_packages }}"
    state: present
    update_cache: true
  become: true

- name: Download Spotify GPG key
  ansible.builtin.get_url:
    url: "{{ spotify_key_url }}"
    dest: /tmp/spotify.pub
    mode: "0644"
  become: true

- name: Dearmor Spotify key into keyring
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes -o {{ spotify_keyring_path }} /tmp/spotify.pub"
    creates: "{{ spotify_keyring_path }}"
  become: true

- name: Add Spotify apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by={{ spotify_keyring_path }}] {{ spotify_repo_url }} stable non-free"
    filename: "{{ spotify_apt_filename }}"
    state: present
    update_cache: true
  become: true

- name: Install spotify-client package
  ansible.builtin.package:
    name: spotify-client
    state: present
    update_cache: true
  become: true
