---
- name: "DESK_THUNAR_CONFIGURE - Build copy tasks per user"
  ansible.builtin.set_fact:
    thunar_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_thunar | default(false) -%}
      {%-   for f in thunar_dotfiles -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}

- name: "DESK_THUNAR_CONFIGURE - Copy thunar/xfce4 dotfiles"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/{{ item.src }}"
    dest: "{{ item.entity.home }}/{{ item.src }}"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0700"
  loop: "{{ thunar_copy_items }}"
  loop_control:
    label: "{{ item.entity.name }}/{{ item.src }}"
  become: true
