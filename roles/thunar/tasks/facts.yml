---
- name: Build thunar dotfile copy items per user
  ansible.builtin.set_fact:
    thunar_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_thunar | default(false) -%}
      {%-   for f in thunar_dotfiles -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}
