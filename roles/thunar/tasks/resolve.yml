---
- name: "DESK_THUNAR_RESOLVE - Validate user catalog references"
  ansible.builtin.assert:
    that:
      - "item.name in users_catalog"
    quiet: true
    fail_msg: "user '{{ item.name }}' in users_list has no entry in users_catalog"
  loop: "{{ users_list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'present'

- name: "DESK_THUNAR_RESOLVE - Resolve users from catalog"
  ansible.builtin.set_fact:
    thunar_users_resolved: >-
      {%- set result = [] -%}
      {%- for entry in users_list -%}
      {%-   set catalog_entry = users_catalog[entry.name] -%}
      {%-   set resolved_entry = catalog_entry | combine({
        'id': entry.name,
        'name': (catalog_entry.name | default(entry.name)),
        'state': (entry.state | default('present')),
        'user_roles': (catalog_entry.user_roles | default({}))
      }) -%}
      {%-   set _ = result.append(resolved_entry) -%}
      {%- endfor -%}
      {{ result }}

- name: "DESK_THUNAR_RESOLVE - Split users into present/absent"
  ansible.builtin.set_fact:
    thunar_users_present: >-
      {%- set filtered = [] -%}
      {%- for u in thunar_users_resolved -%}
      {%-   if u.state == 'present' and u.user_roles.desktop_thunar | default(false) -%}
      {%-     set _ = filtered.append(u) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ filtered }}
    thunar_users_absent: "{{ (thunar_users_resolved | selectattr('state', 'equalto', 'absent') | list) }}"
