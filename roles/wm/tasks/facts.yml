---
- name: "DESK_WM_CONFIGURE - Build copy tasks per user"
  ansible.builtin.set_fact:
    wm_copy_items: >-
      {%- set items = [] -%}
      {%- for entity in identity_users_resolved if entity.state == 'present' and entity.user_roles.desktop_wm | default(false) -%}
      {%-   for f in wm_dotfiles -%}
      {%-     set _ = items.append({'entity': entity, 'src': f}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}
